[package]
name = "ws63-tcxo-model"
version = "0.0.0"
edition = "2024"
publish = false

[features]
model-only = []

[[bin]]
name = "ws63-tcxo-model"
path = "src/main.rs"
required-features = ["model-only"]

[dependencies]
hisi-hal = { path = "../../crates/hisi-hal", default-features = false, features = ["chip-ws63", "embassy", "unstable"] }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt", default-features = false, features = ["chip-ws63", "bundled-memory-x"] }
embassy-time-driver = { version = "0.2.2", features = ["tick-hz-1_000_000"] }

[workspace]

[patch.crates-io]
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }
ws63-pac = { path = "../../crates/chips/ws63/ws63-pac" }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt" }
