[package]
name = "ws53_ram_functions"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[features]
default = ["ram-functions"]
ram-functions = ["hisi-riscv-rt/ws53-ram-functions"]
flash-call = []
flash-data = []
overflow = []

[dependencies]
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt", features = ["chip-ws53", "unstable", "ws53-flash-start"] }
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }

[patch.crates-io]
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }
ws63-pac = { path = "../../crates/chips/ws63/ws63-pac" }
bs2x-pac = { path = "../../crates/chips/bs2x/bs2x-pac" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
