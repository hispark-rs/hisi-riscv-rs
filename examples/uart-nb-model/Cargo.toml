[package]
name = "uart_nb_model"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
chip-ws63 = ["hisi-hal/chip-ws63", "hisi-riscv-rt/chip-ws63", "hisi-riscv-rt/bundled-memory-x"]
chip-bs21 = ["hisi-hal/chip-bs21", "hisi-riscv-rt/chip-bs21", "hisi-riscv-rt/unstable"]
[dependencies]
hisi-hal = { path = "../../crates/hisi-hal", default-features = false, features = ["rt", "unstable"] }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt", default-features = false }
embedded-hal-nb = "1.0"
nb = "1.1"
[patch.crates-io]
ws63-pac = { path = "../../crates/chips/ws63/ws63-pac" }
bs2x-pac = { path = "../../crates/chips/bs2x/bs2x-pac" }
[profile.release]
opt-level = "s"
