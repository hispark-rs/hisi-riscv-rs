[package]
name = "ws53_flash_embassy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
hisi-hal = { path = "../../crates/hisi-hal", default-features = false, features = ["chip-ws53", "rt", "unstable", "embassy"] }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt", features = ["chip-ws53", "unstable", "ws53-flash-start"] }
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }
riscv = "0.13"
critical-section = "1"
embedded-hal = "1"
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-time-driver = "0.2.2"
nb = "1"

[patch.crates-io]
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }
ws63-pac = { path = "../../crates/chips/ws63/ws63-pac" }
bs2x-pac = { path = "../../crates/chips/bs2x/bs2x-pac" }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt" }

[profile.release]
opt-level = "s"
lto = true
debug = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("embassy-fault-probe"))'] }
