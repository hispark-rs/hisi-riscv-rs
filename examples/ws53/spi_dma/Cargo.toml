[package]
name = "ws53_spi_dma"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
width32 = []
poll-smoke = []
async-smoke = ["hisi-hal/async", "dep:embedded-hal-async"]

[dependencies]
hisi-hal = { path = "../../../crates/hisi-hal", default-features = false, features = ["chip-ws53", "rt", "unstable"] }
hisi-riscv-rt = { path = "../../../crates/hisi-riscv-rt", features = ["chip-ws53", "unstable"] }
embedded-hal = "1"
embedded-hal-async = { version = "1", optional = true }
riscv = "0.13"
