[package]
name = "ws53_i2c_control"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
clock-stall-smoke = []
wire-pads = []
arbitration-smoke = []
stuck-smoke = []
mixed-abort-smoke = []
general-call-smoke = []

[dependencies]
hisi-hal = { path = "../../../crates/hisi-hal", default-features = false, features = ["chip-ws53", "rt", "unstable"] }
hisi-riscv-rt = { path = "../../../crates/hisi-riscv-rt", features = ["chip-ws53", "unstable"] }
embedded-hal = "1"
riscv = "0.13"
