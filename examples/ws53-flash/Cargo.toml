[package]
name = "ws53_flash_smoke"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Separate from the RAM workspace: Cargo feature unification must never switch
# a RAM HIL fixture silently to the Flash startup implementation.
[workspace]
resolver = "3"

[features]
tcxo-snapshot-smoke = []
tcxo-nonblocking-smoke = ["tcxo-snapshot-smoke", "dep:nb"]
pwm0-smoke = ["tcxo-nonblocking-smoke"]
rtc-smoke = ["pwm0-smoke"]
capture-delay = ["rtc-smoke"]
timer-async-smoke = ["tcxo-snapshot-smoke", "hisi-hal/async", "dep:embedded-hal-async"]
tsensor-smoke = ["tcxo-snapshot-smoke"]
tsensor-restart-probe = ["tsensor-smoke"]

[dependencies]
hisi-hal = { path = "../../crates/hisi-hal", default-features = false, features = ["chip-ws53", "rt", "unstable"] }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt", features = ["chip-ws53", "unstable", "ws53-flash-start"] }
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }
riscv = "0.13"
critical-section = "1"
embedded-hal = "1"
embedded-hal-async = { version = "1", optional = true }
nb = { version = "1", optional = true }

[patch.crates-io]
ws53-pac = { path = "../../crates/chips/ws53/ws53-pac" }
ws63-pac = { path = "../../crates/chips/ws63/ws63-pac" }
bs2x-pac = { path = "../../crates/chips/bs2x/bs2x-pac" }
hisi-riscv-rt = { path = "../../crates/hisi-riscv-rt" }

[profile.release]
opt-level = "s"
lto = true
debug = true
codegen-units = 1
