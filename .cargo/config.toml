# Default RISC-V target for WS63.
#
# The WS63 application core is RV32IMFC_Zicsr: hardware single-float (ilp32f) and
# NO atomic ('a') extension. We build for `riscv32imfc-unknown-none-elf`, which is
# now an upstream rustc builtin target in the pinned nightly (see
# rust-toolchain.toml).
#
# rustup does not ship a prebuilt rust-std component for this target yet. RISC-V
# build/check/clippy/doc commands must therefore pass `-Zbuild-std=core,alloc`.
# Do not put that in global Cargo config: host-target tests intentionally run on
# stable and would otherwise try to rebuild std as no_std.
#
# `riscv32imfc` here has hardware float and uses forced-atomics + no-CAS, so atomic
# load/store lower to plain ld/st (single hart) and RMW goes through portable-atomic's
# critical-section polyfill (crates/hisi-riscv-hal/Cargo.toml). No lr.w/sc.w/amo* are emitted.
[build]
target = "riscv32imfc-unknown-none-elf"

[target.riscv32imfc-unknown-none-elf]
runner = ".cargo/run-riscv.sh"
# Disable RISC-V linker relaxation (matches the vendor C SDK flow; avoids gp-relative
# relaxation surprises with the custom linker scripts in hisi-riscv-rt).
rustflags = ["-C", "link-arg=--no-relax"]
