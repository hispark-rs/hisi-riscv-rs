default = "ws63"
selectable = ["ws63", "bs21", "bs20"]

[chips.ws63]
display_name = "WS63"
family = "ws63"
status = "stable"
hil = "verified"
qemu_machine = "ws63"
hal_features = "chip-ws63"
rt_features = "chip-ws63,boot-header"
pac_crate = "ws63-pac"
api_chip = "ws63"
app_addr = "0x00230000"
fwpkg_chip = "ws63"
probe_chip = "WS63"
rustdoc_packages = ["hisi-riscv-hal", "ws63-pac", "hisi-riscv-rt"]
rustdoc_features = "hisi-riscv-hal/chip-ws63,hisi-riscv-rt/chip-ws63,hisi-riscv-rt/boot-header"
rustdoc_no_default_features = false
notes = "默认 stable + HIL 验证路径。"

[chips.bs21]
display_name = "BS21"
family = "bs2x"
status = "experimental"
hil = "none"
qemu_machine = "bs21"
hal_features = "chip-bs21,rt,unstable"
rt_features = "chip-bs21,unstable"
pac_crate = "bs2x-pac"
api_chip = "bs21"
app_addr = "0x00090000"
fwpkg_chip = "bs21"
probe_chip = "BS21"
rustdoc_packages = ["hisi-riscv-hal", "bs2x-pac", "hisi-riscv-rt"]
rustdoc_features = "hisi-riscv-hal/chip-bs21,hisi-riscv-hal/rt,hisi-riscv-hal/unstable,hisi-riscv-rt/chip-bs21,hisi-riscv-rt/unstable"
rustdoc_no_default_features = true
notes = "BS2X family 实验路径；当前无真机 HIL 承诺。"

[chips.bs20]
