[workspace]
resolver = "3"
exclude = [
    # Host-only release tooling. Cargo otherwise auto-enrolls path dependencies
    # below the workspace root and `--workspace` tries to build this CLI for RV32.
    "crates/chips/ws63/ws63-radio-sys/crates/hisi-rf-link",
]
members = [
    "crates/chips/ws63/ws63-pac",
    "crates/chips/bs2x/bs2x-pac",
    "crates/hisi-alloc",
    "crates/hisi-crypto",
    "crates/chips/ws63/hisi-crypto-ws63",
    "crates/chips/ws63/hisi-rf-ws63",
    "crates/hisi-rom-sys",
    "crates/hisi-storage",
    "crates/hisi-nvs",
    "crates/hisi-rf-core",
    "crates/hisi-rf",
    "crates/hisi-rf-rtos-driver",
    "crates/hisi-rtos",
    "crates/chips/ws63/hisi-rom-sys-ws63",
    "crates/chips/ws63/ws63-radio-sys/crates/ws63-radio-sys",
    "crates/hisi-hal",
    "crates/hisi-riscv-rt",
    "examples/ws63/blinky",
    "examples/ws63/uart_hello",
    "examples/ws63/uart_tailcall",
    "examples/ws63/uart_stepbystep",
    "examples/ws63/timer_irq",
    "examples/ws63/rtos_embassy_coexist",
    "examples/ws63/rtos_budget_enforcement",
    "examples/ws63/rtos_preemption",
    "examples/ws63/rtos_priority_inheritance",
    "examples/ws63/rtos_scheduler_stress",
    "examples/ws63/gpio_irq",
    "examples/ws63/reset_demo",
    "examples/ws63/dma_loopback",
    "examples/ws63/wifi_blob_link",
    "examples/ws63/rf_port_demo",
    "examples/ws63/wifi_init_smoke",
    "examples/ws63/wifi_connectivity",
    "examples/ws63/semihost_selftest",
    "examples/ws63/custom_memory",
    "examples/ws63/async_delay",
    "examples/ws63/embassy_multitask",
    "examples/ws63/embassy_async_io",
    "examples/ws63/async_bus",
    "examples/ws63/spi_loopback",
    "examples/ws63/i2c_scan",
    "examples/ws63/net_ping",
    "examples/ws63/xip_flash_clk_hazard",
    "chips/ws63/rf",
    "chips/ws63/flashboot",
    # On-target (semihosting) HIL test crate, run via probe-rs + embedded-test.
    # A workspace member (so it is covered by `cargo check --workspace`) but
    # deliberately EXCLUDED from default-members below, so a plain `cargo build`
    # does NOT pull embedded-test. Build/run it explicitly:
    #   cargo test -p tests-hil --target riscv32imfc-unknown-none-elf --no-run
    "tests-hil",
]
# default-members = the libraries + the WS63 example set (each example links via
# hisi-riscv-rt's exported linker scripts; see hisi-riscv-rt/build.rs plus each
# example's build.rs). ws63-flashboot and tests-hil stay workspace members but are
# excluded from a plain `cargo build`: flashboot is experimental/non-secure-boot,
# and tests-hil is an on-target test crate that must be run explicitly.
default-members = [
    "crates/chips/ws63/ws63-pac",
    "crates/hisi-alloc",
    "crates/hisi-crypto",
    "crates/chips/ws63/hisi-crypto-ws63",
    "crates/chips/ws63/hisi-rf-ws63",
    "crates/hisi-storage",
    "crates/hisi-nvs",
    "crates/hisi-rf-core",
    "crates/hisi-rf-rtos-driver",
    "crates/hisi-rtos",
    "crates/chips/ws63/ws63-radio-sys/crates/ws63-radio-sys",
    "crates/hisi-hal",
    "crates/hisi-riscv-rt",
    "examples/ws63/blinky",
    "examples/ws63/uart_hello",
    "examples/ws63/uart_tailcall",
    "examples/ws63/uart_stepbystep",
    "examples/ws63/timer_irq",
    "examples/ws63/rtos_embassy_coexist",
    "examples/ws63/rtos_budget_enforcement",
    "examples/ws63/rtos_preemption",
    "examples/ws63/rtos_priority_inheritance",
    "examples/ws63/rtos_scheduler_stress",
    "examples/ws63/gpio_irq",
    "examples/ws63/reset_demo",
    "examples/ws63/dma_loopback",
    "examples/ws63/wifi_blob_link",
    "examples/ws63/rf_port_demo",
    "examples/ws63/semihost_selftest",
    "examples/ws63/custom_memory",
    "examples/ws63/async_delay",
    "examples/ws63/async_bus",
    "examples/ws63/spi_loopback",
    "examples/ws63/i2c_scan",
    "examples/ws63/net_ping",
    "examples/ws63/xip_flash_clk_hazard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["sanchuanhehe"]
license = "MIT"
repository = "https://github.com/hispark-rs/hisi-riscv-rs"

[workspace.dependencies]
ws63-pac = { path = "crates/chips/ws63/ws63-pac" }
hisi-alloc = { path = "crates/hisi-alloc" }
hisi-crypto = { path = "crates/hisi-crypto" }
hisi-crypto-ws63 = { path = "crates/chips/ws63/hisi-crypto-ws63" }
hisi-rom-sys = { path = "crates/hisi-rom-sys" }
hisi-storage = { path = "crates/hisi-storage" }
hisi-nvs = { path = "crates/hisi-nvs" }
hisi-rf-core = { path = "crates/hisi-rf-core" }
hisi-rf = { path = "crates/hisi-rf" }
hisi-rf-ws63 = { path = "crates/chips/ws63/hisi-rf-ws63" }
hisi-rf-rtos-driver = { path = "crates/hisi-rf-rtos-driver" }
hisi-rtos = { path = "crates/hisi-rtos" }
hisi-rom-sys-ws63 = { path = "crates/chips/ws63/hisi-rom-sys-ws63" }
ws63-radio-sys = { path = "crates/chips/ws63/ws63-radio-sys/crates/ws63-radio-sys" }
hisi-hal = { path = "crates/hisi-hal" }
hisi-riscv-rt  = { path = "crates/hisi-riscv-rt" }

# External dependencies
riscv = "0.13"
riscv-rt = "0.14"
embedded-hal = "1.0.0"
embedded-io = "0.6"
nb = "1"
critical-section = "1"

# hisi-hal (a standalone submodule) depends on ws63-pac via a registry version
# requirement so it builds on its own. Inside this monorepo we redirect that to the
# local submodule so EVERY crate links exactly ONE ws63-pac instance (otherwise the
# PAC's #[no_mangle] DEVICE_PERIPHERALS static is defined twice → link failure, and
# the singleton-safety invariant is split across two copies).
[patch.crates-io]
ws63-pac = { path = "crates/chips/ws63/ws63-pac" }
bs2x-pac = { path = "crates/chips/bs2x/bs2x-pac" }
hisi-alloc = { path = "crates/hisi-alloc" }
hisi-crypto = { path = "crates/hisi-crypto" }
hisi-rom-sys = { path = "crates/hisi-rom-sys" }
hisi-storage = { path = "crates/hisi-storage" }
hisi-nvs = { path = "crates/hisi-nvs" }
hisi-rf-core = { path = "crates/hisi-rf-core" }
hisi-rf = { path = "crates/hisi-rf" }
hisi-rf-ws63 = { path = "crates/chips/ws63/hisi-rf-ws63" }
hisi-rf-rtos-driver = { path = "crates/hisi-rf-rtos-driver" }
hisi-rtos = { path = "crates/hisi-rtos" }
hisi-rom-sys-ws63 = { path = "crates/chips/ws63/hisi-rom-sys-ws63" }
hisi-crypto-ws63 = { path = "crates/chips/ws63/hisi-crypto-ws63" }
ws63-radio-sys = { path = "crates/chips/ws63/ws63-radio-sys/crates/ws63-radio-sys" }
hisi-hal = { path = "crates/hisi-hal" }
# hisi-hal depends on hisi-riscv-rt by version (resolved through cargo);
# patch it to the local submodule for the monorepo build (mirrors the PAC pattern).
hisi-riscv-rt = { path = "crates/hisi-riscv-rt" }
hisi-panic-handler = { path = "crates/hisi-panic-handler" }

[profile.release]
opt-level = "s"
lto = true
debug = true
codegen-units = 1

[profile.dev]
opt-level = "s"
