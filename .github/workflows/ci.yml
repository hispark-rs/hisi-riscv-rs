name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ws63-rs builds with the official upstream Rust nightly pinned in
# rust-toolchain.toml. rustc knows `riscv32imfc-unknown-none-elf`, but rustup does
# not ship its prebuilt rust-std component yet, so RISC-V jobs pass
# `-Zbuild-std=core,alloc`.

jobs:
  # ── Per-crate check ─────────────────────────────────────────────
  build:
    name: Check (RISC-V)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # hisi-hal has NO default chip (0.5.0, esp-hal style), so a bare
        # `cargo check -p hisi-hal` fires the no-chip compile_error; select
        # chip-ws63 for it. ws63-pac / hisi-riscv-rt compile chip-neutrally.
        include:
          - crate: ws63-pac
            args: ""
          - crate: hisi-hal
            args: "--no-default-features --features chip-ws63"
          - crate: hisi-riscv-rt
            args: ""
          # Keep the migration oracle and native WPA3 profiles independently
          # buildable. Workspace feature unification cannot prove either
          # profile's standalone capability boundary.
          - crate: ws63-rf-rs
            args: "--features net,wifi-wpa2-personal"
          - crate: ws63-rf-rs
            args: "--features net,upstream-supplicant-wpa3"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - name: Install upstream supplicant C toolchain
        if: contains(matrix.args, 'upstream-supplicant')
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-unknown-elf
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot; avoid stale target/ reuse across toolchain bumps.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      - name: Check ${{ matrix.crate }}
        run: cargo check -Zbuild-std=core,alloc -p ${{ matrix.crate }} ${{ matrix.args }}
      - name: Reject mixed vendor and upstream supplicant profiles
        if: contains(matrix.args, 'upstream-supplicant')
        run: |
          if cargo check -Zbuild-std=core,alloc -p ws63-rf-rs \
              --features wifi-wpa3-personal,upstream-supplicant-wpa3; then
            echo "ERROR: ws63-rf-rs accepted mixed vendor/upstream profiles" >&2
            exit 1
          fi
          if cargo check -Zbuild-std=core,alloc -p ws63-radio-sys \
              --features wpa3-personal,upstream-supplicant-wpa3; then
            echo "ERROR: ws63-radio-sys accepted mixed vendor/upstream profiles" >&2
            exit 1
          fi

  # ── Full workspace check + library build ────────────────────────
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot; avoid stale target/ reuse across toolchain bumps.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      # AP and STA select mutually exclusive target archives. Cargo features
      # unify across one invocation, so firmware roles are checked separately.
      - name: Check STA and general workspace
        run: >-
          cargo check -Zbuild-std=core,alloc --workspace --exclude wifi_softap
          --features hisi-rf/chip-ws63,hisi-rf/profile-wifi-wpa2-smoltcp
      - name: Check SoftAP firmware role
        run: cargo check -Zbuild-std=core,alloc -p wifi_softap
      # Real link of the default members. Provider-specific legacy Embassy examples
      # are linked separately because a firmware may contain exactly one global
      # embassy-time driver and Cargo unifies dependency features across one build.
      - name: Build default members (release)
        run: cargo build -Zbuild-std=core,alloc --release
      - name: Build legacy HAL Embassy examples separately
        run: |
          cargo build -Zbuild-std=core,alloc --release -p embassy_multitask
          cargo build -Zbuild-std=core,alloc --release -p embassy_async_io

  # ── Target-side connectivity contract on the WS63 QEMU model ─────
  connectivity-contract-qemu:
    name: Connectivity contract (QEMU, contract-only)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/connectivity-contract-qemu
      QEMU_VERSION: v0.4.9
      QEMU_ARCHIVE_SHA256: 16e5f93de1cb3977fbf0b4730f9d1653f572a4e67ed99dc9785edc1ca4165b5a
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/*.py"
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - name: Build the target-side contract fixture
        run: >-
          cargo build -Zbuild-std=core,alloc -p hisi-rf-ws63
          --example connectivity_contract_fixture --release
          --no-default-features --features firmware-example
      - name: Install the pinned WS63 QEMU release
        run: |
          archive="$RUNNER_TEMP/hisi-riscv-qemu-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/hispark-rs/hisi-riscv-qemu/releases/download/$QEMU_VERSION/hisi-riscv-qemu-x86_64-linux.tar.gz"
          echo "$QEMU_ARCHIVE_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Run and verify the shared marker and identity contract
        run: |
          evidence="$RUNNER_TEMP/connectivity-contract-evidence"
          mkdir "$evidence"
          elf="$CARGO_TARGET_DIR/riscv32imfc-unknown-none-elf/release/examples/connectivity_contract_fixture"
          qemu_root="$RUNNER_TEMP/hisi-riscv-qemu-x86_64-linux"
          uv run hil/ws63-connectivity-reset-matrix.py \
            --write-artifact-identity "$evidence/connectivity-artifact.json" \
            --elf "$elf" --profile-id qemu-contract-fixture
          set +e
          LD_LIBRARY_PATH="$qemu_root/lib" timeout 5 \
            "$qemu_root/qemu-system-riscv32" \
            -M ws63 -nographic -bios none -kernel "$elf" \
            </dev/null >"$evidence/run-01.uart.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat "$evidence/run-01.uart.log"
            exit "$status"
          fi
          uv run hil/ws63-connectivity-reset-matrix.py \
            --analyze-dir "$evidence" \
            --output "$evidence/contract" \
            --stage connectivity --require-contract --qemu-contract-fixture \
            --artifact-identity "$evidence/connectivity-artifact.json" \
            --elf "$elf" --profile-id qemu-contract-fixture
          jq -e '
            .counts.pass == 1 and
            .evidence_scope == "contract-only" and
            .records[0].contract.violations == []
          ' "$evidence/contract/summary.json" >/dev/null
      - name: Upload contract-only QEMU evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws63-connectivity-contract-qemu
          path: ${{ runner.temp }}/connectivity-contract-evidence
          if-no-files-found: error

  # ── Stock rust-lld radio link across supported development hosts ──
  radio-link:
    name: Plain Cargo RF link (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: wpa2
            features: chip-ws63,profile-wifi-wpa2-smoltcp
          - os: ubuntu-latest
            profile: wpa3
            features: chip-ws63,profile-wifi-wpa3-smoltcp
          - os: macos-14
            profile: wpa3
            features: chip-ws63,profile-wifi-wpa3-smoltcp
          - os: windows-latest
            profile: wpa3
            features: chip-ws63,profile-wifi-wpa3-smoltcp
    env:
      CARGO_TARGET_DIR: target/plain-radio-${{ matrix.profile }}
      # The facade build script owns linker-script selection for this external
      # consumer contract. Keep only the target policy flag here so the entry
      # script is not loaded twice when memory.x defines named regions.
      CARGO_TARGET_RISCV32IMFC_UNKNOWN_NONE_ELF_RUSTFLAGS: -C link-arg=--no-relax
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/*.py"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src,llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      - name: Build the public-facade radio ELF with ordinary Cargo
        run: >-
          cargo build "-Zbuild-std=core,alloc" -p hisi-rf --release
          --example ws63_plain_firmware
          --features "${{ matrix.features }}"
      - name: Verify standard-relocation final ELF
        run: >-
          uv run scripts/check-ws63-plain-rf-elf.py
          --elf target/plain-radio-${{ matrix.profile }}/riscv32imfc-unknown-none-elf/release/examples/ws63_plain_firmware
          --require-upstream-supplicant
      - name: Install the image-plan truth source
        if: runner.os == 'Linux'
        run: cargo install hisi-fwpkg-cli --version 0.3.2 --locked
      - name: Emit the compile-time RF resource report
        if: runner.os == 'Linux'
        run: >-
          cargo run -p hisi-rf --example ws63_resource_report
          --target x86_64-unknown-linux-gnu
          --features "${{ matrix.features }}"
          > target/plain-radio-${{ matrix.profile }}/rf-resource.json
      - name: Build the canonical flash image and plan
        if: runner.os == 'Linux'
        run: |
          ELF=target/plain-radio-${{ matrix.profile }}/riscv32imfc-unknown-none-elf/release/examples/ws63_plain_firmware
          IMAGE=target/plain-radio-${{ matrix.profile }}/ws63-${{ matrix.profile }}.img
          PLAN=target/plain-radio-${{ matrix.profile }}/ws63-${{ matrix.profile }}.plan.json
          hisi-fwpkg plan "$ELF" --chip ws63 --image-output "$IMAGE" > "$PLAN"
      - name: Assemble the unified RF build report
        if: runner.os == 'Linux'
        run: >-
          uv run --script scripts/assemble-radio-build-report.py
          --resource target/plain-radio-${{ matrix.profile }}/rf-resource.json
          --plan target/plain-radio-${{ matrix.profile }}/ws63-${{ matrix.profile }}.plan.json
          --elf target/plain-radio-${{ matrix.profile }}/riscv32imfc-unknown-none-elf/release/examples/ws63_plain_firmware
          --image target/plain-radio-${{ matrix.profile }}/ws63-${{ matrix.profile }}.img
          --output target/plain-radio-${{ matrix.profile }}/rf-build-report.json
      - name: Upload the unified RF build report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rf-build-report-${{ matrix.profile }}
          path: |
            target/plain-radio-${{ matrix.profile }}/rf-build-report.json
            target/plain-radio-${{ matrix.profile }}/ws63-${{ matrix.profile }}.plan.json
          if-no-files-found: error

  # ── Clippy (gating) ─────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/*.py"
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot; avoid stale target/ reuse across toolchain bumps.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      # Gating: no `continue-on-error`, no `| head` (which would swallow the exit code).
      # ws63-flashboot is now clippy-clean too (was excluded as experimental), so the
      # whole workspace is gated.
      - name: Check HAL register-access policy
        run: uv run crates/hisi-hal/scripts/check-register-access.py
      - name: Check generated ROM artifacts
        run: >-
          uv run crates/chips/ws63/hisi-rom-sys-ws63/tools/sync-ws63-rom.py
          --source crates/chips/ws63/ws63-radio-sys/ws63-RF/rom --check

      - name: Check radio archive profile ownership
        run: uv run scripts/check-radio-profile.py
      - name: Check WS63 runtime compatibility profile
        run: uv run scripts/check-ws63-runtime-compat.py
      - name: Check WS63 supplicant boundary profile
        run: uv run scripts/check-ws63-supplicant-boundary.py
      - name: Check RF production path portability
        run: uv run scripts/check-rf-production-paths.py
      - name: Test the unified RF build report
        run: uv run --script scripts/assemble-radio-build-report.py --self-test
      - name: Test WS63 supplicant final-link boundary
        run: uv run scripts/test-ws63-supplicant-boundary.py
      - name: Test WS63 connectivity marker and identity contract
        run: uv run hil/test-ws63-connectivity-reset-matrix.py
      - name: Check WS63 connectivity shell contract
        run: |
          bash -n \
            hil/ws63-connectivity-smoke.sh \
            hil/ws63-a5b-response-bound.sh \
            hil/lib/ws63-wifi-credentials.sh
          bash hil/test-ws63-wifi-credentials.sh
      - name: Test WS63 runtime compatibility shims
        run: cargo test -p ws63-rf-rs --target x86_64-unknown-linux-gnu --lib
      - name: Run clippy for STA and general workspace
        run: >-
          cargo clippy -Zbuild-std=core,alloc --workspace --exclude wifi_softap
          --features hisi-rf/chip-ws63,hisi-rf/profile-wifi-wpa2-smoltcp -- -D warnings
      - name: Run clippy for SoftAP firmware role
        run: cargo clippy -Zbuild-std=core,alloc -p wifi_softap -- -D warnings

  # ── Format check ────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Host unit tests ─────────────────────────────────────────────
  # hisi-hal's riscv CSR asm is cfg-gated to riscv32 (host gets no-op stubs), and
  # ws63-pac's riscv coupling is gated too, so the crate compiles for x86 and the
  # pure-logic unit tests (encoding, tick math, proptests) actually run. Uses the
  # stable toolchain on the host target (RUSTUP_TOOLCHAIN overrides the nightly pin in
  # rust-toolchain.toml; --target overrides the riscv32 default in .cargo/config.toml).
  host-test:
    name: Host unit tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The HAL has NO default chip (esp-hal style, 0.5.0) and its `default` pulls
      # `rt`, so a bare `cargo test -p hisi-hal` resolves with no chip and every
      # `soc::pac` reference vanishes. Select `chip-ws63` explicitly (mirrors the HAL's
      # `just test` recipe): 309 unit/property tests + the doctests run on the host.
      - name: Run host unit tests (x86_64)
        run: cargo test -p hisi-hal --no-default-features --features chip-ws63 --target x86_64-unknown-linux-gnu

  # ── Dependency audit (advisory) ─────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    # rustsec/audit-check posts results as a check-run/annotations; needs checks: write
    # (default token is read-only here → "Resource not accessible by integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # rust-toolchain.toml pins a nightly; install it before invoking repo-local cargo.
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      # rustsec/audit-check has no Node 24 release; use cargo-audit directly via
      # taiki-e/install-action (composite, Node-24 era) which fetches a prebuilt
      # binary. cargo-audit just parses Cargo.lock + the advisory DB.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
