name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ws63-rs builds with the official upstream Rust nightly pinned in
# rust-toolchain.toml. rustc knows `riscv32imfc-unknown-none-elf`, but rustup does
# not ship its prebuilt rust-std component yet, so RISC-V jobs pass
# `-Zbuild-std=core,alloc`.

jobs:
  # ── Per-crate check ─────────────────────────────────────────────
  build:
    name: Check (RISC-V)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # hisi-hal has NO default chip (0.5.0, esp-hal style), so a bare
        # `cargo check -p hisi-hal` fires the no-chip compile_error; select
        # chip-ws63 for it. ws63-pac / hisi-riscv-rt compile chip-neutrally.
        include:
          - crate: ws63-pac
            args: ""
          - crate: hisi-hal
            args: "--no-default-features --features chip-ws63"
          - crate: hisi-riscv-rt
            args: ""
          # Keep the migration oracle and native WPA3 profiles independently
          # buildable. Workspace feature unification cannot prove either
          # profile's standalone capability boundary.
          - crate: ws63-rf-rs
            args: "--features net,wifi-wpa2-personal"
          - crate: ws63-rf-rs
            args: "--features net,upstream-supplicant-wpa3"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - name: Install upstream supplicant C toolchain
        if: contains(matrix.args, 'upstream-supplicant')
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-unknown-elf
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot; avoid stale target/ reuse across toolchain bumps.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      - name: Check ${{ matrix.crate }}
        run: cargo check -Zbuild-std=core,alloc -p ${{ matrix.crate }} ${{ matrix.args }}
      - name: Reject mixed vendor and upstream supplicant profiles
        if: contains(matrix.args, 'upstream-supplicant')
        run: |
          if cargo check -Zbuild-std=core,alloc -p ws63-rf-rs \
              --features wifi-wpa3-personal,upstream-supplicant-wpa3; then
            echo "ERROR: ws63-rf-rs accepted mixed vendor/upstream profiles" >&2
            exit 1
          fi
          if cargo check -Zbuild-std=core,alloc -p ws63-radio-sys \
              --features wpa3-personal,upstream-supplicant-wpa3; then
            echo "ERROR: ws63-radio-sys accepted mixed vendor/upstream profiles" >&2
            exit 1
          fi

  # ── Full workspace check + library build ────────────────────────
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot; avoid stale target/ reuse across toolchain bumps.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      # Covers every member (incl. blinky + flashboot) at the type/codegen level.
      - name: Check workspace
        run: cargo check -Zbuild-std=core,alloc --workspace
      # Real link of the default members. Provider-specific legacy Embassy examples
      # are linked separately because a firmware may contain exactly one global
      # embassy-time driver and Cargo unifies dependency features across one build.
      - name: Build default members (release)
        run: cargo build -Zbuild-std=core,alloc --release
      - name: Build legacy HAL Embassy examples separately
        run: |
          cargo build -Zbuild-std=core,alloc --release -p embassy_multitask
          cargo build -Zbuild-std=core,alloc --release -p embassy_async_io

  # ── Clippy (gating) ─────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/*.py"
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot; avoid stale target/ reuse across toolchain bumps.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-
      # Gating: no `continue-on-error`, no `| head` (which would swallow the exit code).
      # ws63-flashboot is now clippy-clean too (was excluded as experimental), so the
      # whole workspace is gated.
      - name: Check HAL register-access policy
        run: uv run crates/hisi-hal/scripts/check-register-access.py
      - name: Check generated ROM artifacts
        run: >-
          uv run crates/chips/ws63/hisi-rom-sys-ws63/tools/sync-ws63-rom.py
          --source crates/chips/ws63/ws63-radio-sys/ws63-RF/rom --check

      - name: Check radio archive profile ownership
        run: uv run scripts/check-radio-profile.py
      - name: Check WS63 runtime compatibility profile
        run: uv run scripts/check-ws63-runtime-compat.py
      - name: Check WS63 supplicant boundary profile
        run: uv run scripts/check-ws63-supplicant-boundary.py
      - name: Check RF production path portability
        run: uv run scripts/check-rf-production-paths.py
      - name: Test WS63 supplicant final-link boundary
        run: uv run scripts/test-ws63-supplicant-boundary.py
      - name: Test WS63 connectivity matrix classifier
        run: uv run hil/test-ws63-connectivity-reset-matrix.py
      - name: Test WS63 runtime compatibility shims
        run: cargo test -p ws63-rf-rs --target x86_64-unknown-linux-gnu --lib
      - name: Run clippy
        run: cargo clippy -Zbuild-std=core,alloc --workspace -- -D warnings

  # ── Format check ────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Host unit tests ─────────────────────────────────────────────
  # hisi-hal's riscv CSR asm is cfg-gated to riscv32 (host gets no-op stubs), and
  # ws63-pac's riscv coupling is gated too, so the crate compiles for x86 and the
  # pure-logic unit tests (encoding, tick math, proptests) actually run. Uses the
  # stable toolchain on the host target (RUSTUP_TOOLCHAIN overrides the nightly pin in
  # rust-toolchain.toml; --target overrides the riscv32 default in .cargo/config.toml).
  host-test:
    name: Host unit tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The HAL has NO default chip (esp-hal style, 0.5.0) and its `default` pulls
      # `rt`, so a bare `cargo test -p hisi-hal` resolves with no chip and every
      # `soc::pac` reference vanishes. Select `chip-ws63` explicitly (mirrors the HAL's
      # `just test` recipe): 309 unit/property tests + the doctests run on the host.
      - name: Run host unit tests (x86_64)
        run: cargo test -p hisi-hal --no-default-features --features chip-ws63 --target x86_64-unknown-linux-gnu

  # ── Dependency audit (advisory) ─────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    # rustsec/audit-check posts results as a check-run/annotations; needs checks: write
    # (default token is read-only here → "Resource not accessible by integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # rust-toolchain.toml pins a nightly; install it before invoking repo-local cargo.
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      # rustsec/audit-check has no Node 24 release; use cargo-audit directly via
      # taiki-e/install-action (composite, Node-24 era) which fetches a prebuilt
      # binary. cargo-audit just parses Cargo.lock + the advisory DB.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
