name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/hil.yml'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'ROADMAP.md'
      - 'crates/hisi-riscv-hal'
      - 'crates/hisi-riscv-hal/src/**'
      - 'crates/hisi-riscv-hal/tests/**'
      - 'crates/hisi-riscv-hal/Cargo.toml'
      - 'crates/hisi-riscv-rt'
      - 'crates/hisi-rs-template'
      - 'crates/hisi-rs-template/**'
      - 'crates/pac/ws63-pac'
      - 'crates/pac/ws63-pac/src/**'
      - 'docs/**'
      - 'examples/ws63'
      - 'examples/ws63/**'
      - 'examples/bs21/**'
      - 'examples/bs20/**'
      - 'hil/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/hil.yml'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'ROADMAP.md'
      - 'crates/hisi-riscv-hal'
      - 'crates/hisi-riscv-hal/src/**'
      - 'crates/hisi-riscv-hal/tests/**'
      - 'crates/hisi-riscv-hal/Cargo.toml'
      - 'crates/hisi-riscv-rt'
      - 'crates/hisi-rs-template'
      - 'crates/hisi-rs-template/**'
      - 'crates/pac/ws63-pac'
      - 'crates/pac/ws63-pac/src/**'
      - 'docs/**'
      - 'examples/ws63'
      - 'examples/ws63/**'
      - 'examples/bs21/**'
      - 'examples/bs20/**'
      - 'hil/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Drift checks for generated/duplicated documentation facts ──────────────
  docs-drift:
    name: Documentation Drift Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check agent guide sync
        run: cmp -s AGENTS.md CLAUDE.md

      - name: Check embedded-test HIL registrations
        run: python3 .agents/skills/embedded-test-hil/scripts/hil_inventory.py --strict

      - name: Check HIL smoke marker references
        run: python3 .agents/skills/embedded-test-hil/scripts/check_hil_smoke_markers.py

      - name: Check image-format truth-source drift
        run: python3 scripts/check-image-format-truth.py

      - name: Check happy-path documentation drift
        run: python3 scripts/check-happy-path-docs.py

      - name: Check tutorial snippet contracts
        run: python3 scripts/check-tutorial-snippets.py

  # ── Executable happy path (no hardware) ───────────────────────
  happy-path:
    name: Happy Path Smoke (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install hisi-riscv toolchain
        run: bash .github/scripts/install-toolchain.sh

      - name: Install happy-path tools
        run: |
          cargo +stable install cargo-generate just
          cargo +stable install hisi-fwpkg-cli --version 0.3.0

      - name: Run tutorial contracts
        run: scripts/tutorial-contracts.sh --no-hardware

  # ── Build API docs ────────────────────────────────────────────
  docs:
    name: Build API Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install hisi-riscv toolchain
        run: bash .github/scripts/install-toolchain.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          # registry/git only — target/ is toolchain-specific (see ci.yml note).
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-docs-

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build the mdBook handbook (docs/ -> docs/book)
        run: mdbook build docs

      - name: Build API documentation (hisi-riscv-hal/pac/rt)
        # hisi-riscv-hal has no default chip (0.5.0); select chip-ws63 so its
        # `soc::pac`/`soc::chip` resolve and the no-chip compile_error stays silent.
        run: cargo doc -p hisi-riscv-hal -p ws63-pac -p hisi-riscv-rt --no-deps --features hisi-riscv-hal/chip-ws63

      - name: Assemble the site (handbook at /, rustdoc under /api)
        run: |
          rm -rf site && mkdir -p site/api
          cp -r docs/book/. site/
          cp -r target/riscv32imfc-unknown-none-elf/doc/. site/api/
          # rustdoc has no root index.html; redirect /api/ to the HAL crate's docs.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=hisi_riscv_hal/index.html">\n' > site/api/index.html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: site/

  # ── Deploy to GitHub Pages ────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: api-docs
          path: docs-output

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages on first run (the repo was renamed to hisi-riscv-rs;
          # Pages must be sourced from GitHub Actions). If this still 404s, enable
          # it once in Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── mdBook internal link check (gating) ───────────────────────
  # Validates the handbook's own cross-references (SUMMARY entries, relative
  # links, heading anchors). Runs standalone so it does NOT add a book.toml
  # output backend — the deploy job's `docs/book/` layout stays single-backend.
  # Internal-only: follow-web-links defaults to false, so flaky external URLs
  # are left to the lychee job below. A broken internal link fails this job.
  mdbook-linkcheck:
    name: mdBook Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook + linkcheck
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-linkcheck

      - name: Check internal links
        run: mdbook-linkcheck --standalone docs

  # ── External link check (non-gating) ──────────────────────────
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee.toml scopes the check to this repo's own docs (excludes submodule
          # trees — separate repos — and the TLS-broken blog.japaric.io reference).
          args: --config lychee.toml --verbose --no-progress '*.md' '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
