name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/hil.yml'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'ROADMAP.md'
      - 'crates/hisi-hal'
      - 'crates/hisi-hal/src/**'
      - 'crates/hisi-hal/tests/**'
      - 'crates/hisi-hal/Cargo.toml'
      - 'crates/hisi-riscv-rt'
      - 'crates/hisi-rs-template'
      - 'crates/hisi-rs-template/**'
      - 'crates/chips/ws63/ws63-pac'
      - 'crates/chips/ws63/ws63-pac/src/**'
      - 'docs/**'
      - 'examples/ws63'
      - 'examples/ws63/**'
      - 'examples/bs21/**'
      - 'examples/bs20/**'
      - 'hil/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/hil.yml'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'ROADMAP.md'
      - 'crates/hisi-hal'
      - 'crates/hisi-hal/src/**'
      - 'crates/hisi-hal/tests/**'
      - 'crates/hisi-hal/Cargo.toml'
      - 'crates/hisi-riscv-rt'
      - 'crates/hisi-rs-template'
      - 'crates/hisi-rs-template/**'
      - 'crates/chips/ws63/ws63-pac'
      - 'crates/chips/ws63/ws63-pac/src/**'
      - 'docs/**'
      - 'examples/ws63'
      - 'examples/ws63/**'
      - 'examples/bs21/**'
      - 'examples/bs20/**'
      - 'hil/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Drift checks for generated/duplicated documentation facts ──────────────
  docs-drift:
    name: Documentation Drift Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7

      - name: Check agent guide sync
        run: cmp -s AGENTS.md CLAUDE.md

      - name: Check embedded-test HIL registrations
        run: uv run .agents/skills/embedded-test-hil/scripts/hil_inventory.py --strict

      - name: Check HIL smoke marker references
        run: uv run .agents/skills/embedded-test-hil/scripts/check_hil_smoke_markers.py

      - name: Check Python uv ownership
        run: uv run scripts/check-python-uv.py

      - name: Check image-format truth-source drift
        run: uv run scripts/check-image-format-truth.py

      - name: Check happy-path documentation drift
        run: uv run scripts/check-happy-path-docs.py

      - name: Check tutorial snippet contracts
        run: uv run scripts/check-tutorial-snippets.py

      - name: Check chip docs metadata
        run: uv run scripts/check-chip-docs.py

      - name: Check versioned docs metadata
        run: uv run scripts/check-versioned-docs.py

      - name: Check Pages deployment payload
        run: >-
          uv run scripts/deploy-pages.py --dry-run
          --artifact-id 123
          --build-version 0123456789abcdef0123456789abcdef01234567

  # ── Executable happy path (no hardware) ───────────────────────
  happy-path:
    name: Happy Path Smoke (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      - name: Install happy-path tools
        run: |
          cargo +stable install cargo-generate just
          cargo +stable install hisi-fwpkg-cli --version 0.3.2

      - name: Run tutorial contracts
        run: scripts/tutorial-contracts.sh --no-hardware

  # ── Build API docs ────────────────────────────────────────────
  docs:
    name: Build API Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          # registry/git only — target/ is pinned-nightly/build-std specific.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-docs-

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Seed existing versioned docs site
        run: scripts/seed-docs-site.sh --out site

      - name: Resolve published latest docs version
        run: echo "LATEST_VERSION=$(uv run scripts/read-doc-latest.py --site site)" >> "$GITHUB_ENV"

      - name: Build the mdBook handbook (docs/ -> docs/book)
        run: mdbook build docs
        env:
          DOC_VERSION: main

      - name: Assemble versioned handbook
        run: uv run scripts/assemble-docs-site.py --version main --latest-version "${LATEST_VERSION}" --book docs/book --out site

      - name: Refresh shared docs theme assets
        run: uv run scripts/sync-doc-theme-assets.py --book docs/book --site site

      - name: Build versioned API documentation
        run: scripts/build-rustdoc-site.sh --version main --out site

      - name: Check versioned docs site
        run: uv run scripts/check-versioned-docs.py site

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: site/

  # ── Deploy to GitHub Pages ────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: api-docs
          path: docs-output

      - name: Persist versioned docs state
        id: docs_state
        run: scripts/publish-docs-state.sh --site docs-output --message "Update main docs site"

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages on first run (the repo was renamed to hisi-riscv-rs;
          # Pages must be sourced from GitHub Actions). If this still 404s, enable
          # it once in Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-output

      - name: Deploy to GitHub Pages
        id: deployment
        run: >-
          uv run scripts/deploy-pages.py
          --artifact-id "${{ steps.pages_artifact.outputs.artifact_id }}"
          --build-version "${{ steps.docs_state.outputs.deployment_sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live main documentation
        run: uv run scripts/check-live-docs.py --version main

  # ── mdBook internal link check (gating) ───────────────────────
  # Validates the handbook's own cross-references (SUMMARY entries, relative
  # links, heading anchors). Runs standalone so it does NOT add a book.toml
  # output backend — the deploy job's `docs/book/` layout stays single-backend.
  # Internal-only: follow-web-links defaults to false, so flaky external URLs
  # are left to the lychee job below. A broken internal link fails this job.
  mdbook-linkcheck:
    name: mdBook Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install mdBook + linkcheck
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-linkcheck

      - name: Check internal links
        run: mdbook-linkcheck --standalone docs

  # ── External link check (non-gating) ──────────────────────────
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee.toml scopes the check to this repo's own docs (excludes submodule
          # trees — separate repos — and the TLS-broken blog.japaric.io reference).
          args: --config lychee.toml --verbose --no-progress '*.md' '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
