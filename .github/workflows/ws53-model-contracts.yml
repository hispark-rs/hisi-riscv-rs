name: WS53 model contracts

on:
  pull_request:
  push:
    branches: [main, master, feat/ws53-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws53-model-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bs20-compatibility:
    name: BS20 isolated workspace compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pinned toolchain
        run: bash .github/scripts/install-toolchain.sh
      - name: Build all BS20 examples with their own lockfile
        run: |
          cargo build --locked -Zbuild-std=core,alloc --target riscv32imfc-unknown-none-elf \
            --manifest-path examples/bs20/Cargo.toml --workspace --release
          git diff --exit-code -- examples/bs20/Cargo.lock

  synthetic-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: project
      - uses: actions/checkout@v7
        with:
          repository: hispark-rs/hisi-riscv-qemu
          ref: 2c4aa6114a247d5b173328c90ca26e9e64907913
          path: qemu-overlay
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.3
          cache-dependency-glob: "**/*.py"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev
          bash project/.github/scripts/install-toolchain.sh
      - name: Fetch pinned fixture dependencies
        working-directory: project
        run: |
          for manifest in examples/ws53-hash-model/Cargo.toml examples/ws53-km-model/Cargo.toml \
              examples/ws53-symc-model/Cargo.toml examples/ws53-sdio-init/Cargo.toml \
              examples/ws53-sfc-read/Cargo.toml examples/ws53-ipc/Cargo.toml \
              examples/ws53/ram_smoke/Cargo.toml examples/ws53/spi_control/Cargo.toml \
              examples/ws53-flash/Cargo.toml examples/ws53-ram-functions/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest" --target riscv32imfc-unknown-none-elf
          done
          cargo fetch --locked --manifest-path Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/ws53/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/bs21/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/ws63-gpio-async-model/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/uart-nb-model/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/ws63-uart-async-model/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/ws63-block-on-model/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/ws53-flash-uart-rx/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path "$(rustc --print sysroot)/lib/rustlib/src/rust/library/Cargo.toml" \
            --target riscv32imfc-unknown-none-elf
          for script in ws53_ci_qemu_uart_clock_build.py ws53_crypto_model_build.py test-ws53-crypto-qualified.py \
              ws53_sdio_model_build.py test-ws53-sdio-qualified.py ws53_symc_model_build.py \
              test-ws53-symc-qualified.py ws53_sfc_model_build.py test-ws53-sfc-qualified.py \
              ws53_ipc_endpoint_build.py test-ws53-ipc-spsc-model.py ws53_ipc_random_build.py \
              test-ws53-ipc-random-model.py ws53_model_summary.py \
              ws53_spi_model_build.py test-ws53-spi-wire-ci.py test-ws53-spi-wire-validator.py \
              ws53_spi_collision_build.py test-ws53-spi-collision.py ws53_spi_dma_model_build.py \
              test-ws53-spi-dma-collision.py test-ws53-spi-dma-identity.py test-legacy-spi-write-qemu.py \
              test-bs21-timer-delay-qemu.py test-hal-irq-wait-qemu.py test-gpio-async-qemu.py test-ws53-uart-dma.py test-ws53-spi-dma.py test-ws53-i2c-dma.py \
              test-ws53-ram-elf.py test-ws53-flash-snapshot.py ws53_uart_rx_build.py \
              test-ws53-flash-uart-rx-qemu.py test-qemu-test-support.py test-ws53-uart-receipt.py test-ws63-uart-async-qemu.py test-uart-nb-qemu.py \
              test-ws53-uart-async-tx-qemu.py test-embassy-time-profile.py; do
            uv run --script "scripts/$script" --help > /dev/null
          done
          uv run --script crates/hisi-riscv-rt/scripts/test-ws53-ram-functions-snapshot.py --help > /dev/null
          uv run --offline --script scripts/test-ws53-model-summary.py
      - name: Build fixed QEMU source
        working-directory: project
        run: |
          qemu_python=$(uv run --python 3.12 --no-project -- sh -c 'command -v python')
          uv run --offline --script scripts/ws53_ci_qemu_uart_clock_build.py \
            --overlay-root ../qemu-overlay --python "$qemu_python" \
            --output "$RUNNER_TEMP/ws53-model" --jobs 2 > "$RUNNER_TEMP/ws53-model-build.json"
      - name: Run synthetic model contracts
        working-directory: project
        run: |
          bash scripts/run-ws53-model-contracts.sh "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            "$RUNNER_TEMP/ws53-model/receipt.json" ../qemu-overlay "$RUNNER_TEMP/ws53-contracts"
      - name: Check RTOS and Embassy sharing one timer
        working-directory: project
        run: |
          uv run --script ../qemu-overlay/scripts/ws63_softint_test.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" > "$RUNNER_TEMP/ws63-softint.json"
          cargo build --offline --locked -Zbuild-std=core,alloc --release -p rtos_embassy_coexist \
            --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/rtos-coexist-target"
          uv run --offline --script scripts/test-embassy-time-profile.py --case coexist \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/rtos-coexist-target/riscv32imfc-unknown-none-elf/release/rtos_embassy_coexist" \
            --output "$RUNNER_TEMP/rtos-coexist-default.json"
          cargo build --offline --locked -Zbuild-std=core,alloc --release -p rtos_embassy_coexist \
            --features rtos_embassy_coexist/model-timeline --target riscv32imfc-unknown-none-elf \
            --target-dir "$RUNNER_TEMP/rtos-coexist-target"
          uv run --offline --script scripts/test-embassy-time-profile.py --case coexist --require-timeline \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/rtos-coexist-target/riscv32imfc-unknown-none-elf/release/rtos_embassy_coexist" \
            --output "$RUNNER_TEMP/rtos-coexist-timeline.json"
      - name: Check shared nonblocking UART TX under backpressure
        working-directory: project
        run: |
          uv run --script ../qemu-overlay/scripts/ws63_uart_tx_test.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" > "$RUNNER_TEMP/uart-tx-registers.json"
          for chip in ws63 bs21; do
            cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/uart-nb-model/Cargo.toml \
              --features "chip-$chip" --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/uart-nb-$chip"
            for capacity in 1 16; do
              uv run --offline --script scripts/test-uart-nb-qemu.py \
                --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
                --elf "$RUNNER_TEMP/uart-nb-$chip/riscv32imfc-unknown-none-elf/release/uart_nb_model" \
                --machine "$chip" --capacity "$capacity" --output "$RUNNER_TEMP/uart-nb-$chip-$capacity"
            done
          done
      - name: Check WS63 UART RX IRQ and cancellation with a virtual peer
        working-directory: project
        run: |
          uv run --script ../qemu-overlay/scripts/ws63_uart_rx_test.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" > "$RUNNER_TEMP/ws63-uart-registers.json"
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws63-uart-async-model/Cargo.toml \
            --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws63-uart-target"
          for capacity in 1 16; do
            uv run --offline --script scripts/test-ws63-uart-async-qemu.py \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --elf "$RUNNER_TEMP/ws63-uart-target/riscv32imfc-unknown-none-elf/release/ws63_uart_async_model" \
              --capacity "$capacity" --output "$RUNNER_TEMP/ws63-uart-$capacity"
          done
      - name: Check WS53 UART TX, flush and cancellation through virtual pads
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53/Cargo.toml \
            -p ws53_ram_smoke --features uart2-async-tx-smoke --release \
            --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws53-uart-tx-target"
          uv run --offline --script scripts/test-ws53-uart-async-tx-qemu.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/ws53-uart-tx-target/riscv32imfc-unknown-none-elf/release/ws53_ram_smoke" \
            --output "$RUNNER_TEMP/ws53-uart-tx"
      - name: Check software wakes without a periodic timer
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc --release \
            --manifest-path examples/ws63-block-on-model/Cargo.toml \
            --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws63-block-on-target"
          uv run --offline --script scripts/test-hal-irq-wait-qemu.py --software-wake \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/ws63-block-on-target/riscv32imfc-unknown-none-elf/release/ws63_block_on_model" \
            --output "$RUNNER_TEMP/ws63-block-on.json"
      - name: Check UART receive lifecycle and validation failures
        working-directory: project
        run: |
          uv run --offline --script scripts/test-qemu-test-support.py \
            > "$RUNNER_TEMP/ws53-uart-support.log" 2>&1
          uv run --offline --script scripts/ws53_uart_rx_build.py --output "$RUNNER_TEMP/ws53-uart-build"
          uv run --offline --script scripts/test-ws53-uart-receipt.py \
            --receipt "$RUNNER_TEMP/ws53-uart-build/receipt.json" > "$RUNNER_TEMP/ws53-uart-negative.json"
          for scenario in normal blocked-route cancel-peer-timeout; do
            uv run --offline --script scripts/test-ws53-flash-uart-rx-qemu.py \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --elf "$RUNNER_TEMP/ws53-uart-build/firmware.elf" \
              --build-receipt "$RUNNER_TEMP/ws53-uart-build/receipt.json" \
              --output "$RUNNER_TEMP/uart-$scenario" --scenario "$scenario"
          done
      - name: Check IPC18 random-buffer service
        working-directory: project
        run: |
          uv run --offline --script scripts/ws53_ipc_random_build.py --output "$RUNNER_TEMP/ws53-ipc-random-build"
          uv run --offline --script scripts/test-ws53-ipc-random-model.py --model-policy uart-clock \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
            --elf "$RUNNER_TEMP/ws53-ipc-random-build/firmware.elf" \
            --receipt "$RUNNER_TEMP/ws53-ipc-random-build/receipt.json" --output "$RUNNER_TEMP/ws53-ipc-random-test"
      - name: Check SPI0 digital wire traffic
        working-directory: project
        run: |
          uv run --offline --script scripts/ws53_spi_model_build.py --output "$RUNNER_TEMP/ws53-spi-build"
          uv run --offline --script scripts/test-ws53-ram-elf.py "$RUNNER_TEMP/ws53-spi-build/firmware.elf" \
            > "$RUNNER_TEMP/ws53-ram-elf-negative-tests.log"
          uv run --offline --script scripts/test-ws53-spi-wire-ci.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
            --elf "$RUNNER_TEMP/ws53-spi-build/firmware.elf" --receipt "$RUNNER_TEMP/ws53-spi-build/receipt.json" \
            --output "$RUNNER_TEMP/ws53-spi-test"
          uv run --offline --script scripts/test-ws53-spi-wire-validator.py \
            --report "$RUNNER_TEMP/ws53-spi-test/report.json" --trace "$RUNNER_TEMP/ws53-spi-test/pads.csv"
      - name: Check legacy SPI write drain
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc -p spi_loopback --release \
            --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws63-spi-target"
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/bs21/Cargo.toml \
            -p bs21_spi_loopback --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/bs21-spi-target"
          uv run --offline --script scripts/test-legacy-spi-write-qemu.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --ws63-elf "$RUNNER_TEMP/ws63-spi-target/riscv32imfc-unknown-none-elf/release/spi_loopback" \
            --bs21-elf "$RUNNER_TEMP/bs21-spi-target/riscv32imfc-unknown-none-elf/release/bs21_spi_loopback" \
            --output "$RUNNER_TEMP/ws53-legacy-spi-report.json"
      - name: Check WS53 UART DMA async
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53/Cargo.toml \
            -p ws53_uart_dma --features async-smoke --release --target riscv32imfc-unknown-none-elf \
            --target-dir "$RUNNER_TEMP/ws53-uart-dma-target"
          uv run --offline --script scripts/test-ws53-uart-dma.py --async-smoke \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/ws53-uart-dma-target/riscv32imfc-unknown-none-elf/release/ws53_uart_dma" \
            > "$RUNNER_TEMP/ws53-uart-dma-async-report.json"
      - name: Check WS53 SPI DMA nonblocking and async progress
        working-directory: project
        run: |
          for mode in poll async; do
            for width in 8 32; do
              features="$mode-smoke"
              if [ "$width" = 32 ]; then features="$features,width32"; fi
              cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53/Cargo.toml \
                -p ws53_spi_dma --features "$features" --release --target riscv32imfc-unknown-none-elf \
                --target-dir "$RUNNER_TEMP/ws53-spi-dma-$mode-$width"
              uv run --offline --script scripts/test-ws53-spi-dma.py \
                --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
                --elf "$RUNNER_TEMP/ws53-spi-dma-$mode-$width/riscv32imfc-unknown-none-elf/release/ws53_spi_dma" \
                > "$RUNNER_TEMP/ws53-spi-dma-$mode-$width.json"
              if [ "$mode" = async ]; then
                uv run --offline --script scripts/test-ws53-spi-dma.py --complete-before-wait \
                  --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
                  --elf "$RUNNER_TEMP/ws53-spi-dma-$mode-$width/riscv32imfc-unknown-none-elf/release/ws53_spi_dma" \
                  > "$RUNNER_TEMP/ws53-spi-dma-$mode-$width-early.json"
              fi
            done
          done
      - name: Check WS53 I2C DMA blocking and async progress
        working-directory: project
        run: |
          for mode in blocking async; do
            extra=()
            if [ "$mode" = async ]; then extra=(--features async-smoke); fi
            cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53/Cargo.toml \
              -p ws53_i2c_dma "${extra[@]}" --release --target riscv32imfc-unknown-none-elf \
              --target-dir "$RUNNER_TEMP/ws53-i2c-dma-$mode"
            uv run --offline --script scripts/test-ws53-i2c-dma.py \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --elf "$RUNNER_TEMP/ws53-i2c-dma-$mode/riscv32imfc-unknown-none-elf/release/ws53_i2c_dma" \
              > "$RUNNER_TEMP/ws53-i2c-dma-$mode.json"
          done
      - name: Check BS21 stale timer expiry
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/bs21/Cargo.toml \
            -p bs21_timer_delay --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/bs21-spi-target"
          uv run --offline --script scripts/test-bs21-timer-delay-qemu.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/bs21-spi-target/riscv32imfc-unknown-none-elf/release/bs21_timer_delay"
      - name: Check GPIO async lifecycle and per-pin isolation
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws63-gpio-async-model/Cargo.toml \
            --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws63-gpio-target"
          uv run --offline --script scripts/test-gpio-async-qemu.py --chip ws63 \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/ws63-gpio-target/riscv32imfc-unknown-none-elf/release/ws63_gpio_async_model" \
            --output "$RUNNER_TEMP/ws63-gpio-lifecycle.json"
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53/Cargo.toml \
            -p ws53_ram_smoke --features gpio-async-smoke --release --target riscv32imfc-unknown-none-elf \
            --target-dir "$RUNNER_TEMP/ws53-gpio-target"
          uv run --offline --script scripts/test-gpio-async-qemu.py --chip ws53 \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --elf "$RUNNER_TEMP/ws53-gpio-target/riscv32imfc-unknown-none-elf/release/ws53_ram_smoke" \
            --output "$RUNNER_TEMP/ws53-gpio-lifecycle.json"
      - name: Check executor-independent HAL IRQ waits
        working-directory: project
        run: |
          for channel in 0 1 2; do
            feature=lifecycle-check
            if [ "$channel" != 0 ]; then feature=lifecycle-channel$channel; fi
            cargo build --offline --locked -Zbuild-std=core,alloc -p async_delay --features "async_delay/$feature" --release \
              --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/hal-irq-wait"
            uv run --offline --script scripts/test-hal-irq-wait-qemu.py \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --elf "$RUNNER_TEMP/hal-irq-wait/riscv32imfc-unknown-none-elf/release/async_delay" \
              --lifecycle --channel "$channel" --output "$RUNNER_TEMP/hal-irq-wait-$channel.json"
          done
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53/Cargo.toml \
            -p ws53_ram_smoke --features timer-async-smoke --release --target riscv32imfc-unknown-none-elf \
            --target-dir "$RUNNER_TEMP/ws53-timer-lifecycle"
          uv run --offline --script scripts/test-hal-irq-wait-qemu.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" --chip ws53 \
            --elf "$RUNNER_TEMP/ws53-timer-lifecycle/riscv32imfc-unknown-none-elf/release/ws53_ram_smoke" \
            --output "$RUNNER_TEMP/ws53-timer-lifecycle.json"
      - name: Check Flash and RAM-function ELF snapshots
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53-flash/Cargo.toml \
            --release --features capture-delay --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws53-flash-snapshot"
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/ws53-ram-functions/Cargo.toml \
            --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws53-ram-functions-snapshot"
          ram_elf="$RUNNER_TEMP/ws53-ram-functions-snapshot/riscv32imfc-unknown-none-elf/release/ws53_ram_functions"
          PYTHONOPTIMIZE=1 uv run --offline --script scripts/test-ws53-flash-snapshot.py \
            --elf "$RUNNER_TEMP/ws53-flash-snapshot/riscv32imfc-unknown-none-elf/release/ws53_flash_smoke" \
            --ram-functions-elf "$ram_elf" > "$RUNNER_TEMP/ws53-flash-snapshot-tests.log"
          PYTHONOPTIMIZE=1 uv run --offline --script crates/hisi-riscv-rt/scripts/test-ws53-ram-functions-snapshot.py \
            "$ram_elf" > "$RUNNER_TEMP/ws53-ram-functions-snapshot-tests.log"
      - name: Check status-only SPI collision and recovery
        working-directory: project
        run: |
          for bus in spi0 qspi1; do
            uv run --offline --script scripts/ws53_spi_collision_build.py --bus "$bus" --output "$RUNNER_TEMP/ws53-$bus-collision-build"
            uv run --offline --script scripts/test-ws53-spi-collision.py --bus "$bus" \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
              --elf "$RUNNER_TEMP/ws53-$bus-collision-build/firmware.elf" --receipt "$RUNNER_TEMP/ws53-$bus-collision-build/receipt.json" \
              --output "$RUNNER_TEMP/ws53-$bus-collision-test"
          done
      - name: Check SPI DMA collision and retention
        working-directory: project
        run: |
          for width in 8 32; do
            build="$RUNNER_TEMP/ws53-spi-dma-$width-build"
            uv run --offline --script scripts/ws53_spi_dma_model_build.py --width "$width" --output "$build"
            uv run --offline --script scripts/test-ws53-spi-dma-collision.py \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
              --elf "$build/firmware.elf" --receipt "$build/receipt.json" \
              > "$build/report.json"
            uv run --offline --script scripts/test-ws53-spi-dma-identity.py --width "$width" \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
              --elf "$build/firmware.elf" --receipt "$build/receipt.json" \
              > "$build/identity-negative.json"
          done
