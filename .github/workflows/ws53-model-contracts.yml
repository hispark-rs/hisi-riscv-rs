name: WS53 model contracts

on:
  pull_request:
  push:
    branches: [main, master, feat/ws53-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws53-model-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: project
      - uses: actions/checkout@v7
        with:
          repository: hispark-rs/hisi-riscv-qemu
          ref: 27def194eb9d0d6989cc3c5fb0f0c1da8150be0b
          path: qemu-overlay
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.3
          cache-dependency-glob: "**/*.py"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev
          bash project/.github/scripts/install-toolchain.sh
      - name: Fetch pinned fixture dependencies
        working-directory: project
        run: |
          for manifest in examples/ws53-hash-model/Cargo.toml examples/ws53-km-model/Cargo.toml \
              examples/ws53-symc-model/Cargo.toml examples/ws53-sdio-init/Cargo.toml \
              examples/ws53-sfc-read/Cargo.toml examples/ws53-ipc/Cargo.toml \
              examples/ws53/ram_smoke/Cargo.toml examples/ws53/spi_control/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest" --target riscv32imfc-unknown-none-elf
          done
          cargo fetch --locked --manifest-path Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path examples/bs21/Cargo.toml --target riscv32imfc-unknown-none-elf
          cargo fetch --locked --manifest-path "$(rustc --print sysroot)/lib/rustlib/src/rust/library/Cargo.toml" \
            --target riscv32imfc-unknown-none-elf
          for script in ws53_ci_qemu_uart_clock_build.py ws53_crypto_model_build.py test-ws53-crypto-qualified.py \
              ws53_sdio_model_build.py test-ws53-sdio-qualified.py ws53_symc_model_build.py \
              test-ws53-symc-qualified.py ws53_sfc_model_build.py test-ws53-sfc-qualified.py \
              ws53_ipc_endpoint_build.py test-ws53-ipc-spsc-model.py ws53_model_summary.py \
              ws53_spi_model_build.py test-ws53-spi-wire-ci.py test-ws53-spi-wire-validator.py \
              ws53_spi_collision_build.py test-ws53-spi-collision.py ws53_spi_dma_model_build.py \
              test-ws53-spi-dma-collision.py test-ws53-spi-dma-identity.py test-legacy-spi-write-qemu.py; do
            uv run --script "scripts/$script" --help > /dev/null
          done
          uv run --offline --script scripts/test-ws53-model-summary.py
      - name: Build fixed QEMU source
        working-directory: project
        run: |
          qemu_python=$(uv run --python 3.12 --no-project -- sh -c 'command -v python')
          uv run --offline --script scripts/ws53_ci_qemu_uart_clock_build.py \
            --overlay-root ../qemu-overlay --python "$qemu_python" \
            --output "$RUNNER_TEMP/ws53-model" --jobs 2 > "$RUNNER_TEMP/ws53-model-build.json"
      - name: Run synthetic model contracts
        working-directory: project
        run: |
          bash scripts/run-ws53-model-contracts.sh "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            "$RUNNER_TEMP/ws53-model/receipt.json" ../qemu-overlay "$RUNNER_TEMP/ws53-contracts"
      - name: Check SPI0 digital wire traffic
        working-directory: project
        run: |
          uv run --offline --script scripts/ws53_spi_model_build.py --output "$RUNNER_TEMP/ws53-spi-build"
          uv run --offline --script scripts/test-ws53-spi-wire-ci.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
            --elf "$RUNNER_TEMP/ws53-spi-build/firmware.elf" --receipt "$RUNNER_TEMP/ws53-spi-build/receipt.json" \
            --output "$RUNNER_TEMP/ws53-spi-test"
          uv run --offline --script scripts/test-ws53-spi-wire-validator.py \
            --report "$RUNNER_TEMP/ws53-spi-test/report.json" --trace "$RUNNER_TEMP/ws53-spi-test/pads.csv"
      - name: Check legacy SPI write drain
        working-directory: project
        run: |
          cargo build --offline --locked -Zbuild-std=core,alloc -p spi_loopback --release \
            --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/ws63-spi-target"
          cargo build --offline --locked -Zbuild-std=core,alloc --manifest-path examples/bs21/Cargo.toml \
            -p bs21_spi_loopback --release --target riscv32imfc-unknown-none-elf --target-dir "$RUNNER_TEMP/bs21-spi-target"
          uv run --offline --script scripts/test-legacy-spi-write-qemu.py \
            --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
            --ws63-elf "$RUNNER_TEMP/ws63-spi-target/riscv32imfc-unknown-none-elf/release/spi_loopback" \
            --bs21-elf "$RUNNER_TEMP/bs21-spi-target/riscv32imfc-unknown-none-elf/release/bs21_spi_loopback" \
            --output "$RUNNER_TEMP/ws53-legacy-spi-report.json"
      - name: Check status-only SPI collision and recovery
        working-directory: project
        run: |
          for bus in spi0 qspi1; do
            uv run --offline --script scripts/ws53_spi_collision_build.py --bus "$bus" --output "$RUNNER_TEMP/ws53-$bus-collision-build"
            uv run --offline --script scripts/test-ws53-spi-collision.py --bus "$bus" \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
              --elf "$RUNNER_TEMP/ws53-$bus-collision-build/firmware.elf" --receipt "$RUNNER_TEMP/ws53-$bus-collision-build/receipt.json" \
              --output "$RUNNER_TEMP/ws53-$bus-collision-test"
          done
      - name: Check SPI DMA collision and retention
        working-directory: project
        run: |
          for width in 8 32; do
            build="$RUNNER_TEMP/ws53-spi-dma-$width-build"
            uv run --offline --script scripts/ws53_spi_dma_model_build.py --width "$width" --output "$build"
            uv run --offline --script scripts/test-ws53-spi-dma-collision.py \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
              --elf "$build/firmware.elf" --receipt "$build/receipt.json" \
              > "$build/report.json"
            uv run --offline --script scripts/test-ws53-spi-dma-identity.py --width "$width" \
              --qemu "$RUNNER_TEMP/ws53-model/qemu/build/qemu-system-riscv32" \
              --model-receipt "$RUNNER_TEMP/ws53-model/receipt.json" --model-source ../qemu-overlay \
              --elf "$build/firmware.elf" --receipt "$build/receipt.json" \
              > "$build/identity-negative.json"
          done
      - name: Save model reports and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ws53-model-contracts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ws53-model-build.json
            ${{ runner.temp }}/ws53-model/receipt.json
            ${{ runner.temp }}/ws53-model/command-*.log
            ${{ runner.temp }}/ws53-contracts/**/report.json
            ${{ runner.temp }}/ws53-contracts/**/runner.log
            ${{ runner.temp }}/ws53-contracts/**/build.log
            ${{ runner.temp }}/ws53-contracts/**/receipt.json
            ${{ runner.temp }}/ws53-contracts/**/operations.json
            ${{ runner.temp }}/ws53-contracts/summary.json
            ${{ runner.temp }}/ws53-spi-build/receipt.json
            ${{ runner.temp }}/ws53-spi-build/build.log
            ${{ runner.temp }}/ws53-spi-test/report.json
            ${{ runner.temp }}/ws53-spi-test/pads.csv
            ${{ runner.temp }}/ws53-legacy-spi-report.json
            ${{ runner.temp }}/ws53-spi0-collision-build/receipt.json
            ${{ runner.temp }}/ws53-spi0-collision-build/build.log
            ${{ runner.temp }}/ws53-spi0-collision-test/report.json
            ${{ runner.temp }}/ws53-qspi1-collision-build/receipt.json
            ${{ runner.temp }}/ws53-qspi1-collision-build/build.log
            ${{ runner.temp }}/ws53-qspi1-collision-test/report.json
            ${{ runner.temp }}/ws53-spi-dma-8-build/build.log
            ${{ runner.temp }}/ws53-spi-dma-8-build/receipt.json
            ${{ runner.temp }}/ws53-spi-dma-8-build/report.json
            ${{ runner.temp }}/ws53-spi-dma-8-build/identity-negative.json
            ${{ runner.temp }}/ws53-spi-dma-32-build/build.log
            ${{ runner.temp }}/ws53-spi-dma-32-build/receipt.json
            ${{ runner.temp }}/ws53-spi-dma-32-build/report.json
            ${{ runner.temp }}/ws53-spi-dma-32-build/identity-negative.json
