name: HIL (hardware-in-the-loop)

# On-silicon smoke test: build the examples and flash them to a REAL WS63 board,
# asserting UART markers (the silicon counterpart to the QEMU smoke in ci-nightly).
# This validates what emulation can't — real clocks/timing (24 MHz TCXO timer, 160 MHz
# UART baud) and real peripherals.
#
# REQUIRES a self-hosted runner labelled `ws63-hil` with a board attached and the flash
# rig configured. It will NOT run on GitHub-hosted runners (no such label) — so until
# that runner is registered this workflow is inert and safe. Manual-only by design
# (flashing is destructive); the nightly schedule is left commented for when a board is
# permanently wired up.
#
# This workflow currently drives the example-level smoke suite through the vendor
# hisiflash path; the HAL embedded-test suite uses hil/embedded-test-runner.sh.
# Runner provides the board params via environment or repo variables:
#   HIL_PORT        board UART0 serial port (e.g. /dev/ttyUSB0)
#   HIL_LOADERBOOT  vendor loaderboot.bin path on the runner
#   HIL_ADDRESS     program flash offset (WS63 commonly 0x230000) — verify vs the partition table

on:
  workflow_dispatch:
    inputs:
      chip:
        description: Target chip
        type: choice
        options: [ws63]
        default: ws63
      example:
        description: Single example; use wifi_connectivity for the A4/A5 gate (blank = tutorial smoke suite)
        type: string
        default: ""
      connectivity_profile:
        description: Supplicant path used by the connectivity smoke
        type: choice
        options: [vendor-wpa2, upstream-wpa2, upstream-wpa3]
        default: upstream-wpa2
  # schedule:
  #   - cron: "0 4 * * *"   # nightly once a board is permanently attached

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  hil-smoke:
    name: HIL smoke (${{ github.event.inputs.chip || 'ws63' }})
    # Only a self-hosted runner with the board attached carries this label.
    runs-on: [self-hosted, ws63-hil]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/*.py"

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      - name: Ensure hisiflash
        run: command -v hisiflash >/dev/null 2>&1 || cargo install hisiflash-cli

      - name: Preflight (no writes — fails fast if the rig is incomplete)
        env:
          METHOD: hisiflash
          PORT: ${{ vars.HIL_PORT }}
          LOADERBOOT: ${{ vars.HIL_LOADERBOOT }}
          ADDRESS: ${{ vars.HIL_ADDRESS }}
          PROBE_YAML: ${{ vars.HIL_PROBE_YAML }}
          WS63_CONNECTIVITY_PROFILE: ${{ github.event.inputs.connectivity_profile || 'upstream-wpa2' }}
          WS63_WIFI_AP_MODE: ${{ vars.HIL_WIFI_AP_MODE }}
          WS63_WIFI_SSID: ${{ vars.HIL_WIFI_SSID }}
          WS63_WIFI_PASSPHRASE: ${{ secrets.WS63_WIFI_PASSPHRASE }}
          WS63_WPA_ARCHIVE: ${{ vars.HIL_WPA_ARCHIVE }}
        run: |
          if [ "${{ github.event.inputs.example }}" = wifi_connectivity ] ||
             [ "${{ github.event.inputs.example }}" = wifi_init_smoke ]; then
            bash hil/ws63-connectivity-smoke.sh --preflight
          else
            bash .agents/skills/hil-smoke/hil.sh "${{ github.event.inputs.chip || 'ws63' }}" --preflight
          fi

      - name: Check tutorial HIL contract
        run: |
          test -x hil/hil-smoke.sh
          uv run scripts/check-tutorial-snippets.py

      - name: Tutorial HIL smoke / single example
        env:
          METHOD: hisiflash
          PORT: ${{ vars.HIL_PORT }}
          LOADERBOOT: ${{ vars.HIL_LOADERBOOT }}
          ADDRESS: ${{ vars.HIL_ADDRESS }}
          PROBE_YAML: ${{ vars.HIL_PROBE_YAML }}
          PROBE_SPEED: "3000"
          WS63_CONNECTIVITY_PROFILE: ${{ github.event.inputs.connectivity_profile || 'upstream-wpa2' }}
          WS63_WIFI_AP_MODE: ${{ vars.HIL_WIFI_AP_MODE }}
          WS63_WIFI_SSID: ${{ vars.HIL_WIFI_SSID }}
          WS63_WIFI_PASSPHRASE: ${{ secrets.WS63_WIFI_PASSPHRASE }}
          WS63_WPA_ARCHIVE: ${{ vars.HIL_WPA_ARCHIVE }}
          HIL_CONFIRM: "1"   # deliberate hardware write (see the flash-guard hook)
        run: |
          chip="${{ github.event.inputs.chip || 'ws63' }}"
          ex="${{ github.event.inputs.example }}"
          if [ "$ex" = wifi_connectivity ] || [ "$ex" = wifi_init_smoke ]; then
            bash hil/ws63-connectivity-smoke.sh
          else
            bash .agents/skills/hil-smoke/hil.sh "$chip" $ex
          fi
