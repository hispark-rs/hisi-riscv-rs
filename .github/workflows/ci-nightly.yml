name: Scheduled build + size

on:
  schedule:
    # Run at 04:43 UTC daily
    - cron: '43 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Daily scheduled build of the firmware with the official pinned nightly, plus a
# blinky size report. The latest-nightly upstream radar lives in
# hisi-riscv-rust-toolchain; this workflow protects the reproducible repo pin.

jobs:
  size-report:
    name: Build + firmware size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh
      - uses: actions/cache@v6
        with:
          # Registry/git only. RISC-V target artifacts are tied to the pinned nightly
          # and build-std sysroot.
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-ws63-size-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ws63-size-
      - name: Build default members (release, links blinky)
        run: cargo build -Zbuild-std=core,alloc --release
      - name: Report blinky firmware size
        run: |
          ELF=target/riscv32imfc-unknown-none-elf/release/blinky
          ls -la "$ELF"
          SIZE="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-size"
          "$SIZE" "$ELF" || true
