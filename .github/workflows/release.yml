name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

# Toolchain + default target come from rust-toolchain.toml and .cargo/config.toml.
# RISC-V release builds use the upstream target with `-Zbuild-std=core,alloc`.

jobs:
  source-ci:
    name: Require successful source CI
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the release commit
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              status: 'completed',
              per_page: 100,
            });
            const successful = response.data.workflow_runs.find(
              run => run.name === 'CI' && run.conclusion === 'success'
            );
            if (!successful) {
              core.setFailed(`No successful CI run exists for release SHA ${context.sha}`);
              return;
            }
            core.info(`Source CI: ${successful.html_url}`);

  # ── Create GitHub Release ─────────────────────────────────────
  release:
    name: Create Release
    needs: source-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/*.py"

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      - name: Build release firmware
        run: cargo build -Zbuild-std=core,alloc --release -p blinky

      - name: Install the image-plan truth source
        run: cargo install hisi-fwpkg-cli --version 0.3.2 --locked

      # FlashPlan owns the WS63 header, verified body, hash and erase/write
      # boundaries. The release never publishes an objcopy-derived raw body.
      - name: Package and verify firmware through FlashPlan
        run: |
          set -euo pipefail
          OUT=target/riscv32imfc-unknown-none-elf/release
          ELF="$OUT/blinky"
          IMAGE="$OUT/blinky.img"
          PLAN="$OUT/blinky.plan.json"
          test -f "$ELF"
          cp "$ELF" "$OUT/blinky.elf"
          hisi-fwpkg plan "$ELF" --chip ws63 --image-output "$IMAGE" > "$PLAN"
          uv run --script scripts/check-flash-plan.py --base-address 0x230000 "$PLAN" "$IMAGE"
          hisi-fwpkg --version

      - name: Generate firmware checksums
        run: |
          set -euo pipefail
          OUT=target/riscv32imfc-unknown-none-elf/release
          cd "$OUT"
          sha256sum blinky.elf blinky.img blinky.plan.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          # Globs match the actual artifact names. They produce no files
          # until firmware packaging above runs; gh-release just skips empty matches.
          files: |
            target/riscv32imfc-unknown-none-elf/release/blinky.elf
            target/riscv32imfc-unknown-none-elf/release/blinky.img
            target/riscv32imfc-unknown-none-elf/release/blinky.plan.json
            target/riscv32imfc-unknown-none-elf/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Seed existing versioned docs site
        run: scripts/seed-docs-site.sh --out site

      - name: Resolve published latest docs version
        run: echo "LATEST_VERSION=$(uv run scripts/read-doc-latest.py --site site --candidate \"${GITHUB_REF_NAME}\")" >> "$GITHUB_ENV"

      - name: Build mdBook handbook
        run: mdbook build docs
        env:
          DOC_VERSION: ${{ github.ref_name }}
          LATEST_VERSION: ${{ env.LATEST_VERSION }}

      - name: Assemble versioned handbook
        run: uv run scripts/assemble-docs-site.py --version "${GITHUB_REF_NAME}" --latest-version "${LATEST_VERSION}" --book docs/book --out site

      - name: Refresh shared docs theme assets
        run: uv run scripts/sync-doc-theme-assets.py --book docs/book --site site

      - name: Build versioned API documentation
        run: scripts/build-rustdoc-site.sh --version "${GITHUB_REF_NAME}" --out site
        env:
          LATEST_VERSION: ${{ env.LATEST_VERSION }}

      - name: Check versioned docs site
        run: uv run scripts/check-versioned-docs.py site

      - name: Persist versioned docs state
        id: docs_state
        run: scripts/publish-docs-state.sh --site site --message "Update docs site for ${GITHUB_REF_NAME}"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy versioned docs to GitHub Pages
        id: deployment
        run: >-
          uv run scripts/deploy-pages.py
          --artifact-id "${{ steps.pages_artifact.outputs.artifact_id }}"
          --build-version "${{ steps.docs_state.outputs.deployment_sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live versioned documentation
        run: >-
          uv run scripts/check-live-docs.py
          --version "${GITHUB_REF_NAME}"
          --latest-version "${LATEST_VERSION}"

  # ── crates.io publishing is OWNED BY EACH CRATE'S OWN REPO ─────────────────
  # The monorepo tag only cuts the firmware GitHub Release above. Each library
  # crate is a standalone submodule repo and publishes ITSELF from its own
  # `.github/workflows/release.yml` (triggered by a `v*` tag in that repo, using
  # that repo's CRATES_IO_TOKEN secret). The parent must not reach in and publish
  # the submodules' crates — that couples independent releases and inverts
  # ownership. To release a crate, bump + tag it in its own repo:
  #   ws63-pac  -> github.com/hispark-rs/ws63-pac   (release.yml)
  #   hisi-riscv-rt   -> github.com/hispark-rs/hisi-riscv-rt    (release.yml)
  #   hisi-hal  -> github.com/hispark-rs/hisi-hal   (release.yml)
  # ws63-flashboot / ws63-rf-rs are publish=false (not published).
