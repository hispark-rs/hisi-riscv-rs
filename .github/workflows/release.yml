name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

# Toolchain + default target come from rust-toolchain.toml and .cargo/config.toml.
# RISC-V release builds use the upstream target with `-Zbuild-std=core,alloc`.

jobs:
  # ── Create GitHub Release ─────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      # Build the default-members (libraries + WS63 examples). Only blinky is
      # packaged below; the experimental flashboot binary is not built/attached here.
      - name: Build default members (release)
        run: cargo build -Zbuild-std=core,alloc --release

      # Package the blinky firmware. rust-objcopy comes from llvm-tools-preview.
      - name: Package firmware
        run: |
          set -euo pipefail
          OUT=target/riscv32imfc-unknown-none-elf/release
          OBJCOPY="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-objcopy"
          shopt -s nullglob
          for elf in "$OUT"/blinky; do
            [ -f "$elf" ] || continue
            "$OBJCOPY" -O binary "$elf" "$elf.bin"
            cp "$elf" "$elf.elf"
            echo "packaged $(basename "$elf").bin / .elf"
          done

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          # Globs match the actual artifact names (.elf/.bin). They produce no files
          # until firmware packaging above runs; gh-release just skips empty matches.
          files: |
            target/riscv32imfc-unknown-none-elf/release/blinky.bin
            target/riscv32imfc-unknown-none-elf/release/blinky.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Seed existing versioned docs site
        run: scripts/seed-docs-site.sh --out site

      - name: Build mdBook handbook
        run: mdbook build docs
        env:
          DOC_VERSION: ${{ github.ref_name }}
          LATEST_VERSION: ${{ github.ref_name }}

      - name: Assemble versioned handbook
        run: python3 scripts/assemble-docs-site.py --version "${GITHUB_REF_NAME}" --latest-version "${GITHUB_REF_NAME}" --book docs/book --out site

      - name: Refresh shared docs theme assets
        run: python3 scripts/sync-doc-theme-assets.py --book docs/book --site site

      - name: Build versioned API documentation
        run: scripts/build-rustdoc-site.sh --version "${GITHUB_REF_NAME}" --out site
        env:
          LATEST_VERSION: ${{ github.ref_name }}

      - name: Check versioned docs site
        run: python3 scripts/check-versioned-docs.py site

      - name: Persist versioned docs state
        id: docs_state
        run: scripts/publish-docs-state.sh --site site --message "Update docs site for ${GITHUB_REF_NAME}"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy versioned docs to GitHub Pages
        id: deployment
        run: >-
          python3 scripts/deploy-pages.py
          --artifact-id "${{ steps.pages_artifact.outputs.artifact_id }}"
          --build-version "${{ steps.docs_state.outputs.deployment_sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live versioned documentation
        run: >-
          python3 scripts/check-live-docs.py
          --version "${GITHUB_REF_NAME}"
          --latest-version "${GITHUB_REF_NAME}"

  # ── crates.io publishing is OWNED BY EACH CRATE'S OWN REPO ─────────────────
  # The monorepo tag only cuts the firmware GitHub Release above. Each library
  # crate is a standalone submodule repo and publishes ITSELF from its own
  # `.github/workflows/release.yml` (triggered by a `v*` tag in that repo, using
  # that repo's CRATES_IO_TOKEN secret). The parent must not reach in and publish
  # the submodules' crates — that couples independent releases and inverts
  # ownership. To release a crate, bump + tag it in its own repo:
  #   ws63-pac  -> github.com/hispark-rs/ws63-pac   (release.yml)
  #   hisi-riscv-rt   -> github.com/hispark-rs/hisi-riscv-rt    (release.yml)
  #   hisi-hal  -> github.com/hispark-rs/hisi-hal   (release.yml)
  # ws63-flashboot / ws63-rf-rs are publish=false (not published).
